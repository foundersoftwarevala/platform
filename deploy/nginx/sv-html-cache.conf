# Micro-cache for anonymous public HTML.
#
# Why this exists, measured rather than assumed. Rendering /marketplace is not
# cheap: during a twenty-five request burst the translation container sat at
# about 150% of a core and PostgreSQL at 27%, and forty concurrent visitors
# took between three and fourteen seconds to be served. Every one of those
# requests rebuilt the same page. Cloudflare answers cf-cache-status: DYNAMIC
# for HTML and holds none of it, so every visitor reaches the origin.
#
# Sixty seconds of origin cache turns a burst of identical requests into one
# render. It is deliberately short: the homepage is edited from the Marketplace
# Manager and an operator should not have to wait to see their change.
#
# Why it is safe here, checked before it was written:
#
#   * The site sets no cookies at all, before or after signing in - auth is a
#     JWT in localStorage - so there is no session to leak between visitors.
#   * The server-rendered HTML is identical for an anonymous visitor and a
#     signed-in operator (1,256,467 against 1,256,094 bytes, the difference
#     being live counts). Personalisation happens after hydration, in the
#     browser.
#   * It is always English. The page carries no Devanagari or Arabic and
#     <html lang="en">; the 140-language system translates client-side. So the
#     cache needs no language dimension.
#
# None of that is taken on trust at run time. A request carrying an
# Authorization header or any cookie bypasses the cache and is never stored,
# so the day something does start personalising the server render, that
# request stops being cached rather than being served to somebody else.
#
# Only the paths below are cached. Everything else - /api/*, /checkout,
# /account/*, /login, every manager and console - is untouched and still
# reaches the application on every request.

proxy_cache_path /var/cache/nginx/sv-html
    levels=1:2
    keys_zone=sv_html:20m
    max_size=512m
    inactive=10m
    use_temp_path=off;

# 1 for a public page that may be cached, "" for everything else.
map $uri $sv_cacheable_path {
    default                                   "";
    "~^/$"                                    "1";
    "~^/marketplace/?$"                       "1";
    "~^/marketplace/(category|product|country)/"  "1";
    "~^/vala-tv/?$"                           "1";
    "~^/academy/?$"                           "1";
    "~^/contact/?$"                           "1";
    "~^/apply(/|$)"                           "1";
    "~^/ai/(finder|compare|recommend)/?$"     "1";
}

# Cache only when the path is cacheable AND the request carries neither an
# Authorization header nor a cookie: then, and only then, is the joined value
# exactly "1". Anything else makes it longer and falls to the default.
#   $sv_skip_cache: 1 = do not cache, 0 = cache.
map "$sv_cacheable_path$http_authorization$http_cookie" $sv_skip_cache {
    default  1;
    "1"      0;
}
