# Native SSR personalizes HTML using locale URLs, cookies and Accept-Language.
# The legacy URI-only cache cannot safely distinguish those responses.
# Its stale/background-update mode also retained pre-deployment HTML referring
# to removed hashed assets after the origin started returning private/no-cache.
# Keep the zone required by the existing server block, but bypass it in both
# directions. Public native packs retain their own shared cache and ETags.

proxy_cache_path /var/cache/nginx/sv-html
    levels=1:2
    keys_zone=sv_html:20m
    max_size=512m
    inactive=10m
    use_temp_path=off;

# 1 for a public page that may be cached, "" for everything else.
map $uri $sv_cacheable_path {
    default                                   "";
    "~^/$"                                    "1";
    "~^/marketplace/?$"                       "1";
    "~^/marketplace/(category|product|country)/"  "1";
    "~^/vala-tv/?$"                           "1";
    "~^/academy/?$"                           "1";
    "~^/contact/?$"                           "1";
    "~^/apply(/|$)"                           "1";
    "~^/ai/(finder|compare|recommend)/?$"     "1";
}

# Existing server blocks use this for both proxy_cache_bypass and proxy_no_cache.
map "$sv_cacheable_path$http_authorization$http_cookie" $sv_skip_cache {
    default  1;
}
