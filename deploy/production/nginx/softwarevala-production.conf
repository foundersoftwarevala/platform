# Production domain — softwarevala.net. THE canonical public domain.
# Application: upstream softwarevala_app -> 127.0.0.1:3000 (see conf.d/softwarevala-upstream.conf).
server {
    server_name softwarevala.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://softwarevala_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The visitor address as nginx verified it (conf.d/cloudflare-realip.conf):
        # Cloudflare's header only when the peer is Cloudflare, otherwise the peer.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # Security headers (marketplace audit 2026-09-11). No X-Frame-Options /
        # frame-ancestors: the owner reviews the site inside VS Code Simple Browser,
        # which is an iframe. No Permissions-Policy: the top bar asks for location.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/softwarevala.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/softwarevala.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www.softwarevala.net -> canonical https://softwarevala.net
# (Uses the apex certificate until the www DNS record exists and the certificate
#  is expanded to cover www.)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.softwarevala.net;
    ssl_certificate /etc/letsencrypt/live/softwarevala.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softwarevala.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://softwarevala.net$request_uri;
    }
}

# HTTP -> HTTPS, and www -> apex, for softwarevala.net
server {
    if ($host = softwarevala.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name softwarevala.net www.softwarevala.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://softwarevala.net$request_uri;
    }
    # previously: return 404; # managed by Certbot


}
