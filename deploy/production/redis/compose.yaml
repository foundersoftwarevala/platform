services:
  softwarevala-redis:
    image: redis:7.4-alpine
    container_name: softwarevala-redis
    restart: unless-stopped
    env_file:
      - /etc/softwarevala/redis.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec redis-server --save "" --appendonly no --maxmemory 256mb
        --maxmemory-policy noeviction --protected-mode yes
        --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
