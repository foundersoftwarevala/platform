# Translation system guard: no new hardcoded user-facing text, and a valid
# message catalogue (keys, variables, ICU, language codes). See
# src/lib/i18n/DEVELOPER_GUIDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run i18n:check
      - run: npx vitest run src/lib/i18n
